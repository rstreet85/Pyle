[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'pyle'
dynamic = ['version']
requires-python = '>= 3.14'
dependencies = ['Flask>=3.1', 'Flask-SQLAlchemy>=3.1', 'flask-wtf>=1.3']
authors = [{name = 'Robert Streetman', email = 'robert.streetman.engineer@gmail.com'}]
maintainers = [{name = 'Robert Streetman', email = 'robert.streetman.engineer@gmail.com'}]
description = 'A Flask application for managing automotive maintenance. Track and plan your vehicle services.'
readme = 'README.md'
license = 'MIT'
license-files = ['LICENSE']
classifiers = [
  'Programming Language :: Python :: 3.14',
  'Development Status :: 2 - Pre-Alpha',
  'License :: OSI Approved :: MIT License',
  'Topic :: Scientific/Engineering'
]
keywords = ['Automotive', 'Mechanical', 'Organization']

[project.optional-dependencies]
test = ['pytest>=9.1.1']

[project.urls]
'Home Page' = ''
DOCUMENTATION = ''
Repository = 'https://github.com/rstreet85/Pyle.git'
GitHub = 'https://github.com/rstreet85/Pyle'

